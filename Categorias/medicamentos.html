<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <title>Farmacia Falco - Medicamentos</title>
</head>
<body>

<nav id="navbar" class="navbar navbar-expand-lg navbar-dark bg-falco"></nav>

<main class="container mt-4">
    <h2 class="mb-4">Medicamentos</h2>
    <div class="row g-4" id="contenedor-cards">
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/cards.js"></script>
<script>
    generarNavbar('../');

    const productos = [
        {
            nombre: "Ibuprofeno Actron 400mg",
            descripcion: "Analgésico y antiinflamatorio. Caja x 20 comprimidos.",
            precio: 1200,
            imagen: "../img/actron.avif"
        },
        {
            nombre: "Paracetamol 500mg",
            descripcion: "Analgésico y antipirético. Caja x 24 comprimidos.",
            precio: 950,
            imagen: "../img/paracetamol_500.jpg"
        },
        {
            nombre: "Loratadina 10mg",
            descripcion: "Antihistamínico para alergias. Caja x 10 comprimidos.",
            precio: 1500,
            imagen: "../img/loratadina.webp"
        }
    ];

    const contenedor = document.getElementById('contenedor-cards');
    contenedor.innerHTML = productos.map(p => generarCard(p)).join('');
</script>
</body>
</html>
