<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <title>Farmacia Falco - Cuidado Personal y Perfumería</title>
</head>
<body>
<nav id="navbar" class="navbar navbar-expand-lg navbar-dark bg-falco"></nav>

<main class="container mt-4">
    <h2 class="mb-4">Cuidado Personal y Perfumería</h2>
    <div class="row g-4" id="contenedor-cards">
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/cards.js"></script>
<script>
    generarNavbar('../');

    const productos = [
        {
            nombre: "Crema Nivea 200ml",
            descripcion: "Crema hidratante para todo tipo de piel.",
            precio: 2500,
            imagen: "../img/crema_nivea.webp"
        },
        {
            nombre: "Shampoo Head & Shoulders",
            descripcion: "Shampoo anticaspa. 400ml.",
            precio: 1800,
            imagen: "../img/shampoo_h&s.webp"
        },
        {
            nombre: "Perfume Natura 100ml",
            descripcion: "Fragancia floral para mujer.",
            precio: 8500,
            imagen: "../img/perfume_natura.webp"
        }
    ];

    const contenedor = document.getElementById('contenedor-cards');
    contenedor.innerHTML = productos.map(p => generarCard(p)).join('');
</script>
</body>
</html>
