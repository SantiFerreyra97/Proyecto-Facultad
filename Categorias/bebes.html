<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <title>Farmacia Falco - Bebés y Mamás</title>
</head>
<body>

   <nav id="navbar" class="navbar navbar-expand-lg navbar-dark bg-falco"></nav>

<main class="container mt-4">
    <h2 class="mb-4">Bebés y Mamás</h2>
    <div class="row g-4" id="contenedor-cards">
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/cards.js"></script>
<script>
    generarNavbar('../');

    const productos = [
        {
            nombre: "Pañales Pampers Talle M x40",
            descripcion: "Pañales ultra absorbentes para bebés de 6 a 10kg.",
            precio: 4500,
            imagen: "../img/pañales.png"
        },
        {
            nombre: "Leche Nan Pro 1 400g",
            descripcion: "Leche de fórmula para bebés de 0 a 6 meses.",
            precio: 6200,
            imagen: "../img/leche_nanpro.webp"
        },
        {
            nombre: "Colonia Baby Magic 200ml",
            descripcion: "Colonia suave especial para bebés.",
            precio: 1900,
            imagen: "../img/colonia_babymagic.webp"
        }
    ];

    const contenedor = document.getElementById('contenedor-cards');
    contenedor.innerHTML = productos.map(p => generarCard(p)).join('');
</script>

</body>
</html>
