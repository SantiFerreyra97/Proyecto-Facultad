<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Farmacia Falco</title>
</head>
<body>

    <nav id="navbar" class="navbar navbar-expand-lg navbar-dark bg-falco"></nav>

<main class="container mt-4">

  <!-- Hero section -->
  <div class="p-5 mb-4 rounded-3 text-white" style="background-color: var(--color-primary);">
    <h1 class="display-5 fw-bold">Farmacia Falco</h1>
    <p class="lead">Tu farmacia de confianza — productos de salud, cuidado personal y más.</p>
    <a href="pages/categorias/medicamentos.html" class="btn btn-light btn-lg">Ver productos</a>
  </div>

  <!-- Medicamentos -->
  <h2 class="mb-4">Medicamentos Destacados</h2>
  <div class="row g-4 mb-5" id="contenedor-medicamentos"></div>

  <!-- Cuidado Personal -->
  <h2 class="mb-4">Cuidado Personal Destacado</h2>
  <div class="row g-4 mb-5" id="contenedor-cuidado"></div>

  <!-- Bebés -->
  <h2 class="mb-4">Bebés y Mamás Destacado</h2>
  <div class="row g-4 mb-5" id="contenedor-bebes"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/navbar.js"></script>
<script src="js/cards.js"></script>
<script src="js/productos.js"></script>
<script>
    generarNavbar();

    async function cargarHome() {
        const medicamentos = await cargarProductos('medicamentos');
        const cuidado = await cargarProductos('cuidado-personal');
        const bebes = await cargarProductos('bebes');

        // Mostrar solo 3 productos de cada categoría
        document.getElementById('contenedor-medicamentos').innerHTML = 
            medicamentos.slice(0, 3).map(p => generarCard(p)).join('');
        
        document.getElementById('contenedor-cuidado').innerHTML = 
            cuidado.slice(0, 3).map(p => generarCard(p)).join('');
        
        document.getElementById('contenedor-bebes').innerHTML = 
            bebes.slice(0, 3).map(p => generarCard(p)).join('');
    }

    cargarHome();
</script>

</body>
</html>
