<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <title>Farmacia Falco - Carrito</title>
</head>
<body>

<nav id="navbar" class="navbar navbar-expand-lg navbar-dark bg-falco"></nav>

<main class="container mt-4">
    <h2 class="mb-4">Mi Carrito</h2>
    <div id="contenedor-carrito"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/navbar.js"></script>
<script>
    generarNavbar('../');
    renderizarCarrito();

    function renderizarCarrito() {
        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const contenedor = document.getElementById('contenedor-carrito');

        if (carrito.length === 0) {
            contenedor.innerHTML = `
                <div class="text-center py-5">
                    <p class="text-muted fs-5">Tu carrito está vacío.</p>
                    <a href="../index.html" class="btn btn-primary mt-2">Ver productos</a>
                </div>`;
            return;
        }

        let total = 0;
        let filas = carrito.map(p => {
            const subtotal = p.precio * p.cantidad;
            total += subtotal;
            return `
                <tr>
                    <td class="align-middle">${p.nombre}</td>
                    <td class="align-middle">$${p.precio.toLocaleString('es-AR')}</td>
                    <td class="align-middle">
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-outline-secondary btn-sm" onclick="cambiarCantidadCarrito(${p.id}, -1)">−</button>
                            <span>${p.cantidad}</span>
                            <button class="btn btn-outline-secondary btn-sm" onclick="cambiarCantidadCarrito(${p.id}, 1)">+</button>
                        </div>
                    </td>
                    <td class="align-middle fw-bold">$${subtotal.toLocaleString('es-AR')}</td>
                    <td class="align-middle">
                        <button class="btn btn-danger btn-sm" onclick="eliminarDelCarrito(${p.id})">Eliminar</button>
                    </td>
                </tr>`;
        }).join('');

        contenedor.innerHTML = `
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>${filas}</tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <button class="btn btn-outline-danger" onclick="vaciarCarrito()">Vaciar carrito</button>
                <h4 class="mb-0">Total: <span style="color: var(--color-primary);">$${total.toLocaleString('es-AR')}</span></h4>
            </div>`;
    }

    function eliminarDelCarrito(id) {
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        carrito = carrito.filter(p => p.id !== id);
        localStorage.setItem('carrito', JSON.stringify(carrito));
        actualizarContadorCarrito();
        renderizarCarrito();
    }

    function cambiarCantidadCarrito(id, cambio) {
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const idx = carrito.findIndex(p => p.id === id);
        if (idx < 0) return;
        carrito[idx].cantidad = Math.max(1, carrito[idx].cantidad + cambio);
        localStorage.setItem('carrito', JSON.stringify(carrito));
        actualizarContadorCarrito();
        renderizarCarrito();
    }

    function vaciarCarrito() {
        localStorage.removeItem('carrito');
        actualizarContadorCarrito();
        renderizarCarrito();
    }
</script>

</body>
</html>
